name: Generate TRMNL Dashboard Data

on:
  schedule:
    # Every 5 minutes (GitHub Actions minimum granularity)
    - cron: "*/5 * * * *"
  workflow_dispatch:   # allow manual trigger

concurrency:
  group: generate-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate data.json
        run: python api/generate.py

      - name: Publish data.json via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import json, base64, urllib.request, urllib.error, os

          token = os.environ["GITHUB_TOKEN"]
          repo  = os.environ["GITHUB_REPOSITORY"]
          path  = "api/data.json"
          url   = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept":        "application/vnd.github+json",
              "Content-Type":  "application/json",
          }

          with open(path, "rb") as f:
              content = base64.b64encode(f.read()).decode()

          # Get current file SHA (needed for updates)
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as r:
                  sha = json.loads(r.read())["sha"]
          except urllib.error.HTTPError:
              sha = None

          payload = {
              "message": "chore: update dashboard data [skip ci]",
              "content": content,
              "branch":  "main",
          }
          if sha:
              payload["sha"] = sha

          req = urllib.request.Request(
              url, data=json.dumps(payload).encode(), method="PUT", headers=headers
          )
          with urllib.request.urlopen(req) as r:
              result = json.loads(r.read())
          print(f"✓ Published: {result['commit']['sha'][:7]}")
          EOF
