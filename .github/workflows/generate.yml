name: Generate TRMNL Dashboard Data

on:
  schedule:
    # Every 5 minutes (GitHub Actions minimum granularity)
    - cron: "*/5 * * * *"
  workflow_dispatch:   # allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate data.json
        run: python api/generate.py

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add api/data.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "chore: update dashboard data [skip ci]"
          git push
